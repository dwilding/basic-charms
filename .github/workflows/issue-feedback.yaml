name: Issue feedback (supplied default configuration)

on:
  issues:
    types:
      - opened
      - reopened

permissions:
  contents: read
  issues: write

jobs:
  feedback:
    uses: SecondSkoll/generic-agentic-workflows/.github/workflows/opencode-issue-feedback.yml@4aa41d5f5fd551f89769d9f3f67c0be3c8bf8bde
    permissions:
      contents: read
      issues: write
    with:
      configuration_source: default
      configuration_ref: 4aa41d5f5fd551f89769d9f3f67c0be3c8bf8bde
      configuration_profile: issue-feedback
      focus: general
      max_issues: 20
      dry_run: true
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
