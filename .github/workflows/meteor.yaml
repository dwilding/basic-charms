name: meteor

on:
  pull_request:
    paths:
      - .github/workflows/meteor.yaml
      - meteor/**
      - micron/**
  workflow_dispatch:

permissions: {}

jobs:
  pack-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - name: Set up tox and tox-uv
        run: uv tool install tox --with tox-uv
      - name: Lint
        working-directory: meteor
        run: |
          uvx --python 3.10 --with tox-uv tox -e lint
      - name: Run unit tests
        working-directory: meteor
        run: |
          uvx --python 3.10 --with tox-uv tox -e unit
      - name: Set up Concierge
        run: sudo snap install --classic concierge
      - name: Set up Juju and charm development tools
        run: sudo concierge prepare -p machine
      - name: Pack the charm
        working-directory: meteor
        run: charmcraft pack
      - name: Pack micron charm for relation integration
        working-directory: micron
        run: charmcraft pack
      - name: Run integration tests
        working-directory: meteor
        run: |
          MICRON_CHARM_PATH="$(cd ../micron && pwd)/$(cd ../micron && ls -1 micron_*.charm | head -n1)" \
            tox -e integration -- --juju-dump-logs logs
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: juju-dump-logs
          path: meteor/logs
